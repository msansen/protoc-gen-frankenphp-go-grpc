name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.27.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: make test
      - run: make vet
      - run: test -z "$(gofmt -l .)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" ./cmd/protoc-gen-frankenphp-go-grpc

  runtime:
    runs-on: ubuntu-latest
    container:
      image: dunglas/frankenphp:1.13.4-builder
    steps:
      - uses: actions/checkout@v5
      - name: Test and vet the runtime with native FrankenPHP libraries
        shell: bash
        run: |
          export CGO_CFLAGS="${CGO_CFLAGS:-} $(php-config --includes)"
          make test-runtime vet-runtime
