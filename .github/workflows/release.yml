name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.event.repository.name }}
    GHCR_NAMESPACE: ${{ github.repository_owner }}
    DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
jobs:

    #
    # Docker image
    #
    docker:
        name: Docker
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: |
                      ${{ env.REGISTRY }}/${{ env.GHCR_NAMESPACE }}/${{ env.IMAGE_NAME }}
                      ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=raw,value=latest

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: binary
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VERSION=${{ github.ref_name }}
                      COMMIT=${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    #
    # Standalone binaries
    #
    binaries:
        name: Binary ${{ matrix.goos }}/${{ matrix.goarch }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false

            matrix:
                include:
                    - goos: linux
                      goarch: amd64

                    - goos: linux
                      goarch: arm64

                    - goos: darwin
                      goarch: amd64

                    - goos: darwin
                      goarch: arm64

                    - goos: windows
                      goarch: amd64

                    - goos: windows
                      goarch: arm64

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build binary
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: binary
                  build-args: |
                      GOOS=${{ matrix.goos }}
                      GOARCH=${{ matrix.goarch }}
                      VERSION=${{ github.ref_name }}
                      COMMIT=${{ github.sha }}
                  outputs: type=local,dest=./dist
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Rename binary
              shell: bash
              run: |
                  if [ "${{ matrix.goos }}" = "windows" ]; then
                    source="dist/protoc-gen-frankenphp-go-grpc.exe"
                    target="protoc-gen-frankenphp-go-grpc-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
                  else
                    source="dist/protoc-gen-frankenphp-go-grpc"
                    target="protoc-gen-frankenphp-go-grpc-${{ matrix.goos }}-${{ matrix.goarch }}"
                  fi
                   
                  mv "$source" "dist/$target"

            - name: Upload artifact
              uses: actions/upload-artifact@v6
              with:
                  name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
                  path: dist/*
                  if-no-files-found: error


    #
    # GitHub Release
    #
    release:
        name: GitHub Release
        runs-on: ubuntu-latest

        needs:
            - docker
            - binaries

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Download binaries
              uses: actions/download-artifact@v7
              with:
                  pattern: binary-*
                  path: dist
                  merge-multiple: true

            - name: Package templates
              shell: bash
              run: |
                  tar -czf "dist/template_files-${{ github.ref_name }}.tgz" -C internal/generator templates/

            - name: Generate checksums
              working-directory: dist
              run: sha256sum * > checksums.txt

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${{ github.ref_name }}" \
                    --repo "${{ github.repository }}" \
                    --verify-tag \
                    --generate-notes \
                    --title "${{ github.ref_name }}" \
                    dist/*
