name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing release tag to publish (for example v0.1.0)"
                required: true
                type: string

permissions:
    contents: write
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.event.repository.name }}
    GHCR_NAMESPACE: ${{ github.repository_owner }}
    DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
jobs:
    resolve:
        name: Resolve release tag
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            tag: ${{ steps.release.outputs.tag }}
            sha: ${{ steps.release.outputs.sha }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Validate tag and resolve commit
              id: release
              shell: bash
              env:
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  set -euo pipefail
                  if [[ "$RELEASE_TAG" != v* ]] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
                    echo "::error::Expected a valid release tag beginning with v"
                    exit 1
                  fi
                  release_sha=$(git rev-parse --verify --end-of-options "refs/tags/${RELEASE_TAG}^{commit}")
                  printf 'tag=%s\nsha=%s\n' "$RELEASE_TAG" "$release_sha" >> "$GITHUB_OUTPUT"

    #
    # Docker image
    #
    docker:
        name: Docker
        runs-on: ubuntu-latest
        needs: resolve

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  ref: ${{ needs.resolve.outputs.sha }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: |
                      ${{ env.REGISTRY }}/${{ env.GHCR_NAMESPACE }}/${{ env.IMAGE_NAME }}
                      ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.tag }}
                      type=semver,pattern={{major}},value=${{ needs.resolve.outputs.tag }}
                      type=raw,value=latest

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: binary
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VERSION=${{ needs.resolve.outputs.tag }}
                      COMMIT=${{ needs.resolve.outputs.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    #
    # Standalone binaries
    #
    binaries:
        name: Binary ${{ matrix.goos }}/${{ matrix.goarch }}
        runs-on: ubuntu-latest
        needs: resolve

        strategy:
            fail-fast: false

            matrix:
                include:
                    - goos: linux
                      goarch: amd64

                    - goos: linux
                      goarch: arm64

                    - goos: darwin
                      goarch: amd64

                    - goos: darwin
                      goarch: arm64

                    - goos: windows
                      goarch: amd64

                    - goos: windows
                      goarch: arm64

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  ref: ${{ needs.resolve.outputs.sha }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build binary
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: binary
                  build-args: |
                      GOOS=${{ matrix.goos }}
                      GOARCH=${{ matrix.goarch }}
                      VERSION=${{ needs.resolve.outputs.tag }}
                      COMMIT=${{ needs.resolve.outputs.sha }}
                  outputs: type=local,dest=./dist
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Rename binary
              shell: bash
              run: |
                  if [ "${{ matrix.goos }}" = "windows" ]; then
                    source="dist/protoc-gen-frankenphp-go-grpc.exe"
                    target="protoc-gen-frankenphp-go-grpc-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
                  else
                    source="dist/protoc-gen-frankenphp-go-grpc"
                    target="protoc-gen-frankenphp-go-grpc-${{ matrix.goos }}-${{ matrix.goarch }}"
                  fi
                   
                  mv "$source" "dist/$target"

            - name: Upload artifact
              uses: actions/upload-artifact@v6
              with:
                  name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
                  path: dist/*
                  if-no-files-found: error


    #
    # GitHub Release
    #
    release:
        name: GitHub Release
        runs-on: ubuntu-latest

        needs:
            - resolve
            - docker
            - binaries

        env:
            RELEASE_TAG: ${{ needs.resolve.outputs.tag }}

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  ref: ${{ needs.resolve.outputs.sha }}

            - name: Download binaries
              uses: actions/download-artifact@v7
              with:
                  pattern: binary-*
                  path: dist
                  merge-multiple: true

            - name: Package templates
              shell: bash
              run: |
                  tar -czf "dist/template_files-${RELEASE_TAG}.tgz" -C internal/generator templates/

            - name: Generate checksums
              working-directory: dist
              run: sha256sum * > checksums.txt

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$RELEASE_TAG" \
                    --repo "${{ github.repository }}" \
                    --verify-tag \
                    --generate-notes \
                    --title "$RELEASE_TAG" \
                    dist/*
